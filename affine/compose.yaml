name: affine
services:
  affine:
    image: ghcr.io/toeverything/affine:0.26.3
    container_name: affine_server
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ./storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine:${DB_PASSWORD}@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
      DB_USERNAME: affine
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: affine
      AFFINE_SERVER_HTTPS: "true"
      AFFINE_SERVER_HOST: ${AFFINE_SERVER_HOST}
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL}
    restart: unless-stopped

  affine_migration:
    image: ghcr.io/toeverything/affine:0.26.3
    container_name: affine_migration_job
    volumes:
      - ./storage:/root/.affine/storage
      - ./config:/root/.affine/config
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine:${DB_PASSWORD}@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
      DB_USERNAME: affine
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: affine
      AFFINE_SERVER_HTTPS: "true"
      AFFINE_SERVER_HOST: ${AFFINE_SERVER_HOST}
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis
    container_name: affine_redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # you better set a password for you database
      # or you may add 'POSTGRES_HOST_AUTH_METHOD=trust' to ignore postgres security policy
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine", "-d", "affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
