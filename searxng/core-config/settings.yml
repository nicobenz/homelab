# SearXNG — tracked in git; mounted at /etc/searxng via compose.
# SEARXNG_SECRET and SEARXNG_BASE_URL in Dockhand override secret_key / base_url.

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG"

search:
  safe_search: 2
  autocomplete: duckduckgo
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: true
