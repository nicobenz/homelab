services:
  searxng:
    image: docker.io/searxng/searxng:2026.5.21-b9340f50c
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
    volumes:
      # Bind files explicitly so an empty core-config/ dir cannot trigger
      # "creating from template..." (template allows only html → 403 on format=json).
      - ./core-config/settings.yml:/etc/searxng/settings.yml:ro
      - ./core-config/limiter.toml:/etc/searxng/limiter.toml:ro
      - ./data:/var/cache/searxng
