name: flights

services:
  web:
    image: ghcr.io/affromero/flight-finder:0.9.3
    container_name: flights
    restart: always
    init: true
    ipc: host
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/flight_finder
      REDIS_URL: redis://redis:6379
      CHROME_PATH: /usr/bin/chromium-browser
      NODE_ENV: production
      SELF_HOSTED: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      EXPRESSVPN_API_URL: http://expressvpn:8000
      EXPRESSVPN_SOCKS_URL: socks5://expressvpn:1080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      expressvpn:
        condition: service_started

  expressvpn:
    image: docker.io/misioslav/expressvpn:latest
    container_name: flights-expressvpn
    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      CODE: ${EXPRESSVPN_CODE}
      SERVER: smart
      PROTOCOL: auto
      NETWORK: off
      ALLOW_LAN: "true"
      SOCKS: on
      SOCKS_PORT: 1080
      CONTROL_SERVER: on
      CONTROL_PORT: 8000
      CONTROL_AUTH_TYPE: none
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db:
    image: postgres:16-alpine
    container_name: flights-db
    restart: always
    environment:
      POSTGRES_DB: flight_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flights-redis
    restart: always
    volumes:
      - ./redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
